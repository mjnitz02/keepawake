name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
# head_ref (PR source branch) falls back to ref (push), so push + PR runs for
# one branch share a group instead of running twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # Must be macOS. The helper links ApplicationServices, and the scripts use
    # pmset, ioreg, and BSD stat, none of which exist on a Linux runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell syntax
        run: |
          for f in bin/keepawake libexec/keepawake-daemon \
                   libexec/keepawake-nudge-agent install.sh uninstall.sh \
                   tests/*.sh; do
            bash -n "$f" || exit 1
            echo "ok  $f"
          done

      - name: Plist syntax
        run: |
          for p in launchd/*.plist; do plutil -lint "$p" || exit 1; done

      - name: Executable bits
        # A missing +x makes the installer produce a broken install, and it is
        # the kind of thing a rebase quietly drops.
        run: |
          rc=0
          for f in bin/keepawake libexec/keepawake-daemon \
                   libexec/keepawake-nudge-agent install.sh uninstall.sh \
                   tests/run.sh; do
            if [ ! -x "$f" ]; then echo "not executable: $f"; rc=1; fi
          done
          exit $rc

      - name: Run tests
        run: tests/run.sh

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        # SC1090/SC1091: the config file is sourced from a runtime path.
        # SC2317: functions defined for the test suite to source look unreachable.
        run: |
          shellcheck --severity=warning -e SC1090,SC1091,SC2317 \
            bin/keepawake \
            libexec/keepawake-daemon \
            libexec/keepawake-nudge-agent \
            install.sh uninstall.sh tests/*.sh
